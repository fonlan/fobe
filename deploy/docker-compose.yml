services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      args:
        # Same $VERSION is injected into fobe-server and fobe-agent, and it is
        # the §5.5 self-update target. "compose" is deliberately not a release
        # identifier (it contains no digit), so an unversioned local build never
        # tells probes to "follow": set FOBE_VERSION to a real tag to exercise
        # agent auto-update locally.
        VERSION: ${FOBE_VERSION:-compose}
    image: fobe-server:latest
    restart: unless-stopped
    # Loopback only: the operator's nginx is the single public entry
    # (design.md §2). When nginx runs on another host, change to
    # "0.0.0.0:8080:8080" and firewall the source (README: 拓扑 B).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../data/sqlite:/data
      - ../data/dl:/srv/dl
      - ../data/backup:/backup
    environment:
      FOBE_MASTER_KEY: ${FOBE_MASTER_KEY:?needed}
      FOBE_ADMIN_PASSWORD: ${FOBE_ADMIN_PASSWORD:-}
      FOBE_DB: /data/fobe.db
      FOBE_WEB_DIR: /srv/web
      FOBE_DL_DIR: /srv/dl
      FOBE_TRUSTED_PROXIES: "127.0.0.1/32,::1/128,172.16.0.0/12"
      # sing-box artifact cache (design §9.2): download the current stable
      # release when the cache is empty; override the bases for mirrors or
      # air-gapped installs.
      FOBE_SINGBOX_AUTO_DOWNLOAD: "${FOBE_SINGBOX_AUTO_DOWNLOAD:-1}"
      FOBE_SINGBOX_API_BASE: "${FOBE_SINGBOX_API_BASE:-}"
      FOBE_SINGBOX_DOWNLOAD_BASE: "${FOBE_SINGBOX_DOWNLOAD_BASE:-}"
      # GeoIP database refresh (design §14.1): keyless mirrors by default; pin
      # FOBE_GEOIP_URL for an internal mirror or air-gapped install, and set
      # FOBE_GEOIP_AUTO_UPDATE=0 to stop every automatic download. The file
      # itself lives under the /data mount (geoip/GeoLite2-Country.mmdb).
      FOBE_GEOIP_AUTO_UPDATE: "${FOBE_GEOIP_AUTO_UPDATE:-1}"
      FOBE_GEOIP_URL: "${FOBE_GEOIP_URL:-}"
      FOBE_GEOIP_ONLINE: "${FOBE_GEOIP_ONLINE:-0}"
